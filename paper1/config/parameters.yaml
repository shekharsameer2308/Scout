constants:
  R: {value: 8.314, unit: "J/(mol K)", source: "Ideal gas constant"}
  mol_vol: {value: 0.022414, unit: "m3/mol", source: "Volume at STP"}

module_a:
  geometry:
    L: {value: 0.25, unit: "m", source: "P3 Table 1"}
    dm: {value: 0.010, unit: "m", source: "P3 Table 1"}
    tm: {value: 0.005, unit: "m", source: "P3 Table 1"}
    wall_thickness: {value: 0.006, unit: "m", source: "assumed"}
  
  kinetics:
    source: "P3 Table 2 (Mignard & Pritchard)"
    k1_pre: 1.07
    k1_E: 40000
    k2_pre: 1.22e10
    k2_E: -98084
    K_H2O_pre: 6.62e-11
    K_H2O_E: 124119
    sqrt_K_H2_pre: 0.499
    sqrt_K_H2_E: 17197
    K_H2O_H2: 3453.38

  permeation:
    source: "P3 Table 3 & Li et al. 2020"
    rho_m: 1900.0
    b0: [1.64e-12, 5.64e-15, 3.22e-9] # H2O, CH3OH, H2
    dH_ads: [40000, 65000, 5900]
    q_sat: [15.0, 6.2, 1.0]
    Ea: [36000, 17000, 1900]
    D0: [8.1e-7, 2.5e-8, 1.0e-9]
    D0_H2O_MULT: 300.0

  cases:
    - name: "Base Case"
      T: 250.0
      P_ret: 100.0
      P_perm: 100.0
      dP: 0.0
      GHSV: 5000.0
      S_F: 1.0
      O_M_V_r: 26.67
      rho_B: 1697.0
      pol_factor: 1.0
      
    - name: "GHSV 500"
      T: 250.0
      P_ret: 100.0
      P_perm: 100.0
      dP: 0.0
      GHSV: 500.0
      S_F: 1.0
      O_M_V_r: 26.67
      rho_B: 1697.0
      pol_factor: 1.0

    - name: "High Area"
      T: 250.0
      P_ret: 100.0
      P_perm: 100.0
      dP: 0.0
      GHSV: 5000.0
      S_F: 1.0
      O_M_V_r: 133.33
      rho_B: 1697.0
      pol_factor: 1.0

    - name: "Fast Sweep"
      T: 250.0
      P_ret: 100.0
      P_perm: 100.0
      dP: 0.0
      GHSV: 5000.0
      S_F: 10.0
      O_M_V_r: 26.67
      rho_B: 1697.0
      pol_factor: 1.0

    - name: "Best Case (Fig 12 Discrepancy)"
      T: 250.0
      P_ret: 100.0
      P_perm: 100.0
      dP: 0.0
      GHSV: 500.0
      S_F: 10.0
      O_M_V_r: 133.33
      rho_B: 1697.0
      pol_factor: 1.0

    - name: "Best Case (Text Discrepancy)"
      T: 250.0
      P_ret: 100.0
      P_perm: 100.0
      dP: 0.0
      GHSV: 500.0
      S_F: 10.0
      O_M_V_r: 26.67
      rho_B: 1697.0
      pol_factor: 1.0
      
    - name: "Best Case + dP 99 bar"
      T: 250.0
      P_ret: 100.0
      P_perm: 1.0
      dP: 99.0
      GHSV: 500.0
      S_F: 10.0
      O_M_V_r: 133.33
      rho_B: 1697.0
      pol_factor: 1.0

module_b:
  geometry:
    L: {value: 0.25, unit: "m", source: "assumed (same as A)"}
  kinetics:
    source: "assumed (Temkin-Pyzhev with H2 inhibition)"
    k_rate: 0.1
    K_H2: 0.5
  permeation:
    source: "P1 eq. 1-3 (Sieverts law)"
    Pe_H2: 1.0e-5
    alpha_H2_N2: 10000.0
  cases:
    - name: "Ammonia Decomposition Base"
      T: 400.0
      P_ret: 7.0
      P_perm: 1.0
      F_in_NH3: 0.001
      W_cat: 0.01
      SMA: 0.33
      tm: 0.0001
    - name: "Jiang 2021 Target"
      T: 400.0
      P_ret: 7.0
      P_perm: 1.0
      F_in_NH3: 0.001
      W_cat: 0.01
      SMA: 4.5
      tm: 0.0001
