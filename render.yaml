databases:
  - name: scout-db
    databaseName: scout_db
    user: scout
    plan: free

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: scout-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString
      - key: NEWSAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # 2. Streamlit Frontend Web Service
  - type: web
    name: scout-frontend
    runtime: docker
    dockerfilePath: docker/Dockerfile.frontend
    healthCheckPath: /_stcore/health
    plan: free
    envVars:
      - key: PORT
        value: "8501"
      - key: API_URL
        value: http://scout-backend:8000
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # 3. Daily Ingestion Pipeline (Cron Job)
  - type: cron
    name: scout-pipeline
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    schedule: "0 0 * * *" # Run daily at midnight UTC
    dockerCommand: "python -m data_pipeline.scheduler.pipeline_runner --run-topics"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString
      - key: NEWSAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
